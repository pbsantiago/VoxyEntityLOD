plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.ladysnake.org/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // MixinExtras for @WrapOperation (spectator mode toggle).
    include modImplementation("io.github.llamalad7:mixinextras-fabric:0.3.5")

    // Voxy (compile-only from local jar).
    compileOnly files("../voxy-mc_1201/build/libs/voxy-0.2.14-alpha.jar")

    // Create (compile-only, fabric 6.0.8.1 — same as the Create-mc1.20.1-fabric-dev checkout).
    // Transitive deps (flywheel, porting-lib, ponder/catnip) come nested inside the Create jar;
    // they were extracted to libs/nested/ so loom can see them on the compile classpath.
    modCompileOnly files("libs/create_fabric_6.0.8.1.jar")
    modCompileOnly fileTree("libs/nested"){ include "*.jar" }
}


processResources {
    inputs.property "version", project.version
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_description", project.mod_description
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "mod_name": project.mod_name,
               "mod_description": project.mod_description
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
